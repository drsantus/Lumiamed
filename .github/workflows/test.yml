name: Test motore fiscale

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck del motore (src/core, src/db)
        run: npm run typecheck:core
      - name: Test dei calcoli fiscali
        run: npm test
      - name: La cartella src/core non deve importare React Native
        run: |
          if grep -rnE "from ['\"](react|react-native|expo[^'\"]*)['\"]" src/core; then
            echo "src/core deve restare logica pura: niente import di React/Expo."; exit 1
          fi
